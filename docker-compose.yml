x-spark-base: &spark-base
  build:
    context: .
    dockerfile: Dockerfile
  image: spark-hudi-minio

services:
  spark-master:
    <<: *spark-base
    container_name: spark-master
    hostname: spark-master
    environment:
      SPARK_MASTER_WEBUI_PORT: 8083
    ports:
      - "7077:7077"
      - "8083:8083"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    volumes:
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./scripts:/opt/scripts
    networks:
      - lite-platform-network

  spark-worker:
    <<: *spark-base
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_WEBUI_PORT: 8084
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true"
    ports:
      - "8084-8096:8084"
    deploy:
      replicas: 2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - lite-platform-network

  spark-history:
    <<: *spark-base
    container_name: spark-history
    hostname: spark-history
    depends_on:
      - spark-master
    ports:
      - "18080:18080"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.history.HistoryServer
    volumes:
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - lite-platform-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data
    networks:
      - lite-platform-network

  minio-init:
    restart: "no"
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z  
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c 
      - |
        echo "Waiting for MinIO...";
        until mc alias set local http://minio:9000 \
          minioadmin minioadmin; do
          sleep 2;
        done;

        mc mb -p local/spark-logs || true
        mc mb -p local/data-bureau || true
    networks:
      - lite-platform-network

networks:
  lite-platform-network:
    driver: bridge
